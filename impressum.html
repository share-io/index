<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Share.io - Impressum</title>

<style>

:root{
 --bg:#060b16;
 --bg2:#0b1324;
 --surface:rgba(15,23,42,.75);
 --text:#eaf4ff;
 --muted:#8ea4c0;
 --accent:#49d3ff;
 --border:rgba(255,255,255,.08);
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

body{

 min-height:100vh;

 font-family:"Segoe UI",sans-serif;

 background:
 radial-gradient(
 circle at top,
 rgba(73,211,255,.15),
 transparent 35%
 ),

 linear-gradient(
 135deg,
 var(--bg),
 var(--bg2)
 );

 color:var(--text);

}

.container{

 max-width:900px;

 margin:80px auto;

 padding:30px;

 background:rgba(17,25,40,.65);

 backdrop-filter:blur(12px);

 border:1px solid var(--border);

 border-radius:24px;

}

h1{

 color:var(--accent);

 margin-bottom:25px;

}

p{

 line-height:1.8;

 color:var(--muted);

 margin-bottom:15px;

}

.back-btn{

 display:inline-block;

 margin-top:25px;

 padding:12px 20px;

 background:#49d3ff;

 color:#06111f;

 text-decoration:none;

 border-radius:10px;

 font-weight:700;

}

</style>

</head>

<body>

<div class="container">

<h1>Impressum</h1>

<p>

Verantwortlich für diese Website:

</p>

<p>

Organisation Share.io

</p>

<p>

Weitere Angaben werden hier ergänzt.

</p>

<a
href="https://share-io.github.io/index/main.html"
class="back-btn">

Zurück

</a>

</div>

</body>

</html>
